# Human-readable NextOps deployment dossier. This is a planning contract, not an installer.
# Keep real infrastructure identifiers and secrets in the approved private deployment record.
---
$schema: ./server-dependency.schema.json
schema_version: 1.0.0
manifest_revision: '2026-09-21'
server_id: nextops-connectors-ro
evidence_status: planning_contract_not_deployed
purpose: Run the protected execution gateway and isolated read-only connector runners, initially for bounded
  Zabbix API evidence, while keeping target credentials and management-LAN access away from the app, browser,
  and model.
authorization:
  documentation_authorized: true
  provisioning_authorized: false
  operational_access_authorized: false
  destructive_actions_authorized: false
  notes: The owner authorized this deployment dossier and accepted the read-only connector boundary. VM
    creation, package installation, private routing, token creation/delivery, target calls, firewall changes,
    and service startup require separate authorization.
source_records:
  - docs/requirements/HARDWARE_BASELINE.json
  - docs/requirements/ZABBIX_SERVER_PLAN.json
  - docs/en/SERVER_PLAN.md
  - docs/en/MCP.md
  - docs/en/INTEGRATIONS.md
  - docs/en/SECURITY.md
  - docs/en/OFFLINE_RUNTIME.md
  - docs/PROJECT_STATE.md
vm:
  hypervisor: VMware ESXi 8.0.3 build 24414501 (owner-supplied host evidence)
  guest_os: Ubuntu Server 24.04 LTS proposed; exact image and maintained patch lock required
  vcpu: 4
  ram_gib: 8
  disk_gib: 80
  firmware: null
  cpu_hot_add: null
  proposed_datastore_alias: DS-C
  placement_status: Capacity-based proposal only; no reservation, routing, connector, credential, or VM
    is evidenced.
  deployment_order: 3 of the three NextOps VMs; define after app/AI boundaries and activate target credentials
    only after Stage 1A policy/audit gates pass
  preflight_requirements:
    - Refresh host/datastore capacity and confirm VM compatibility, free resources, storage health, swap
      placement, and existing commitments.
    - Define separate gateway and Zabbix-runner identities/processes even when they share this VM.
    - Confirm an allowlisted route only from the Zabbix runner to the approved Zabbix frontend/API and
      no broad device-management route.
    - Confirm local DNS/time/CA behavior, certificate and host validation, administrator recovery, and
      offline package availability.
    - Keep all mutations disabled in Phase 1 and do not expose arbitrary method, URL, shell, PowerShell,
      SQL, or container-socket access.
service_accounts:
  - id: nextops-gateway
    scope: authenticated policy recheck, limits, audit coordination, and routing to named connector operations
    login: false
    privilege: non-root; no target secret access and no direct target network route
    status: planned_not_created
  - id: nextops-zabbix-ro
    scope: isolated Zabbix runner for explicitly allowlisted read methods and approved host-group scope
    login: false
    privilege: non-root; sole NextOps consumer of the Zabbix API token; no mutation, arbitrary URL, shell,
      SQL, or browser access
    status: planned_not_created
  - id: nextops-connector-import
    scope: controlled provisioning-time verification/promotion of connector releases and offline dependencies
    login: false
    privilege: write to approved staging/release paths only during an authorized import; not a runtime
      identity
    status: planned_not_created
software_dependencies:
  - id: ubuntu-server
    kind: guest_os
    version: 24.04 LTS maintained patch (exact image pending)
    runtime_location: local
    required: true
    status: proposed_not_installed
    lock_evidence: null
  - id: python
    kind: runtime
    version: '>=3.12,<3.13'
    runtime_location: local
    required: true
    status: locked_for_current_stage_1a_source_only
    lock_evidence: pyproject.toml and uv.lock
  - id: nextops-gateway-runner-release
    kind: application
    version: null
    runtime_location: local
    required: true
    status: not_implemented_or_built
    lock_evidence: null
  - id: official-mcp-python-sdk
    kind: protocol_sdk
    version: null
    runtime_location: local
    required: true
    status: proposed_not_added_or_locked
    lock_evidence: null
  - id: zabbix-json-rpc-client-stack
    kind: connector_dependency
    version: null
    runtime_location: local
    required: true
    status: not_selected_or_locked
    lock_evidence: null
  - id: local-ca-bundle
    kind: trust_store
    version: null
    runtime_location: local
    required: true
    status: private_pki_input_missing
    lock_evidence: null
  - id: zabbix-frontend-api
    kind: target_service
    version: null
    runtime_location: approved_lan
    required: true
    status: endpoint_version_base_path_and_permissions_not_verified
    lock_evidence: null
  - id: local-dns-time-pki
    kind: infrastructure_service
    version: null
    runtime_location: approved_lan
    required: true
    status: private_input_not_verified
    lock_evidence: null
  - id: independent-backup-target
    kind: recovery_service
    version: null
    runtime_location: approved_lan
    required: true
    status: production_gate_not_selected
    lock_evidence: null
artifacts:
  - id: nextops-connectors-release
    purpose: Pinned gateway and Zabbix-runner application release with typed operation schemas and deterministic
      limits
    install_path: /srv/nextops/releases/connectors/<release-id>
    version: null
    sha256: null
    license_record: null
    source_record: null
    status: not_implemented_or_built
  - id: connector-offline-dependencies
    purpose: Complete locked Python/native dependency set for offline installation
    install_path: /srv/nextops/artifacts/connectors
    version: null
    sha256: null
    license_record: null
    source_record: null
    status: not_prepared
  - id: zabbix-connector-manifest
    purpose: Versioned supported-target matrix, named tools, JSON schemas, method allowlist, limits, errors,
      permissions, and fixtures
    install_path: /srv/nextops/releases/connectors/<release-id>/manifests/zabbix.json
    version: null
    sha256: null
    license_record: not_applicable
    source_record: null
    status: not_implemented
  - id: connector-tls-public-chain
    purpose: Public trust material for app-to-gateway and runner-to-Zabbix certificate validation; private
      keys delivered separately
    install_path: /etc/nextops/tls
    version: null
    sha256: null
    license_record: not_applicable
    source_record: null
    status: private_pki_input_missing
configuration_files:
  - id: gateway-config
    path: /etc/nextops/gateway.yaml
    owner: root:nextops-gateway
    mode: '0640'
    contains_secret_values: false
    status: planned_no_runtime_schema_or_parser_yet
    required_settings:
      - authenticated app client identity and audience
      - enabled connector manifest IDs/versions
      - request, concurrency, deadline, row, byte, and output limits
      - audit failure and cancellation behavior
      - runner transport and identity mappings
  - id: inventory-config
    path: /etc/nextops/inventory.yaml
    owner: root:nextops-gateway
    mode: '0640'
    contains_secret_values: false
    status: planned_reference_only_no_runtime_parser_yet
    required_settings:
      - immutable Zabbix target ID and organization/environment scope
      - approved HTTPS endpoint/base-path reference
      - allowed resolved addresses and redirect policy
      - verified API/target version and last-verification time
  - id: credential-reference-config
    path: /etc/nextops/credentials.yaml
    owner: root:nextops-zabbix-ro
    mode: '0640'
    contains_secret_values: false
    status: planned_reference_only_no_runtime_parser_yet
    required_settings:
      - opaque Zabbix token reference ID and consumer identity
      - expiry/rotation metadata without the token value
      - no password, token, private key, or decrypting key
  - id: policy-config
    path: /etc/nextops/policies.yaml
    owner: root:nextops-gateway
    mode: '0640'
    contains_secret_values: false
    status: planned_external_policy_format_not_implemented
    required_settings:
      - deny-by-default organization/environment/target/action/scope rules
      - trusted READ_ONLY operation registry
      - explicit deny for all mutations and unlisted connector tools
  - id: zabbix-runner-config
    path: /etc/nextops/connectors/zabbix.yaml
    owner: root:nextops-zabbix-ro
    mode: '0640'
    contains_secret_values: false
    status: connector_not_implemented
    required_settings:
      - target and credential reference IDs
      - certificate trust and redirect-disabled behavior
      - apiinfo.version probe plus authenticated method compatibility
      - host-group scope and field/method allowlists
      - time-range, pagination, row, byte, deadline, and concurrency caps
      - redaction, partial/stale result, and evidence timestamp rules
secret_references:
  - id: gateway-service-auth-ref
    consumer: nextops-gateway
    reference_only: true
    delivery_requirement: Audience-bound internal credential accepted only from nextops-app; never reuse
      a user session or target token
    rotation_requirement: Support audited rotation/revocation without opening an unauthenticated bypass
    status: internal_auth_design_not_implemented
  - id: zabbix-api-token-ref
    consumer: nextops-zabbix-ro only
    reference_only: true
    delivery_requirement: Protected runner-local delivery; never accessible to gateway, app, browser,
      model, screenshots, normal logs, or shared environment
    rotation_requirement: Record expiry/rotation/revocation; expired or revoked credentials fail explicitly
      with no fallback identity
    status: identity_token_scope_and_delivery_not_created
  - id: connector-tls-private-key-ref
    consumer: nextops-gateway or runner only if mutual TLS is selected
    reference_only: true
    delivery_requirement: Restricted key path or approved local key service with offline unlock/recovery
    rotation_requirement: Define offline renewal, revocation, rollback, and expiry alerting
    status: private_pki_input_missing
network:
  runtime_internet_required: false
  public_exposure_allowed: false
  management_interface: Authorized local administrator route only; gateway and runner are internal services
    and must not be browser/public endpoints.
  rules:
    - id: app-to-gateway
      direction: inbound
      source: nextops-app service identity
      destination: nextops-gateway
      protocol: authenticated_streamable_http_or_reviewed_internal_transport
      port: null
      tls: authenticated encrypted transport required when networked
      decision: allow_planned
      status: transport_port_certificate_and_identity_not_selected
    - id: gateway-to-zabbix-runner
      direction: outbound
      source: nextops-gateway
      destination: nextops-zabbix-ro isolated runner
      protocol: local_stdio_or_authenticated_local_transport
      port: null
      tls: required if a network transport is selected
      decision: allow_planned
      status: transport_and_process_isolation_not_implemented
    - id: runner-to-zabbix-api
      direction: outbound
      source: nextops-zabbix-ro only
      destination: approved Zabbix frontend api_jsonrpc.php endpoint
      protocol: tcp
      port: 443
      tls: certificate and hostname validation required; redirects disabled unless separately allowlisted
      decision: allow_planned
      status: private_endpoint_base_path_certificate_and_route_not_verified
    - id: admin-ssh
      direction: inbound
      source: approved administrator network
      destination: nextops-connectors-ro guest
      protocol: tcp
      port: 22
      tls: SSH host-key validation required
      decision: allow_planned
      status: private_admin_path_and_recovery_not_verified
    - id: unapproved-targets-and-methods
      direction: outbound
      source: gateway and all connector runners
      destination: any endpoint, address, redirect, or managed device outside approved inventory
      protocol: any
      port: any
      tls: not_applicable
      decision: deny_required
      status: must_be_enforced_at_inventory_network_and_application_boundaries
    - id: runtime-internet
      direction: outbound
      source: all connector services
      destination: Internet, remote MCP registries, SaaS telemetry, and package registries
      protocol: any
      port: any
      tls: not_applicable
      decision: deny_required
      status: must_be_enforced_and_tested
    - id: approved-local-infrastructure
      direction: outbound
      source: connector guest
      destination: approved local DNS, time, certificate, monitoring, and backup services
      protocol: deployment_specific
      port: null
      tls: certificate/host validation required where applicable
      decision: allow_planned
      status: private_endpoints_and_ports_missing
  unresolved:
    - Private IP, DNS, VLAN, route, firewall, administrator, and recovery details
    - App-to-gateway and gateway-to-runner transports, ports, identities, and certificates
    - Zabbix frontend base path/version, resolved addresses, certificate chain, and approved host-group
      scope
    - Local DNS/time/CA/monitoring/backup endpoints and evidence that all other egress is denied
storage:
  total_disk_gib: 80
  layout_status: Total VMDK approved as a starting proposal; partition/LVM/filesystem allocation is not
    designed or authorized.
  mounts:
    - path: /
      purpose: Guest OS and immutable gateway/runner runtime
      size_gib: null
      filesystem: null
      owner: root:root
      mode: '0755'
      status: layout_required_before_provisioning
    - path: /etc/nextops
      purpose: Gateway, inventory, policy, connector settings, and secret references
      size_gib: null
      filesystem: null
      owner: root:nextops-gateway
      mode: '0750'
      status: planned_not_created
    - path: /srv/nextops/releases/connectors
      purpose: Versioned offline gateway/runner releases and last-known-good rollback release
      size_gib: null
      filesystem: null
      owner: root:nextops-gateway
      mode: '0750'
      status: release_and_growth_budget_missing
    - path: /var/lib/nextops/connectors
      purpose: Bounded transient connector state and sanitized evidence handoff; not a secret store or
        durable job authority
      size_gib: null
      filesystem: null
      owner: nextops-gateway:nextops-gateway
      mode: '0750'
      status: retention_and_cleanup_contract_missing
    - path: /var/log/nextops
      purpose: Sanitized gateway/runner operational logs separate from application audit
      size_gib: null
      filesystem: null
      owner: nextops-gateway:nextops-gateway
      mode: '0750'
      status: retention_and_rotation_missing
  capacity_rules:
    - The 80-GiB VMDK includes OS, gateway/runner releases, bounded transient evidence, logs, rollback
      artifacts, and guest swap.
    - Do not retain full Zabbix history or duplicate the application audit/database on this VM.
    - Transient evidence cleanup must preserve referenced durable evidence in the app store and must never
      fall back to deleting a broad/unverified path.
    - Retain the 3-TB project ceiling and approximately 900-GiB DS-C free-space target; refresh capacity
      at the change window.
    - Independent off-host backup is required for release/config/recovery material; a same-G10 copy is
      staging only.
  destructive_commands_included: false
service_order:
  - order: 1
    service: config/release mounts, local trust, and protected runner secret access
    readiness: Expected files verify; secret reference resolves only for the intended runner; missing
      mounts or trust fail closed.
  - order: 2
    service: nextops-zabbix-ro runner
    readiness: Runner accepts only authenticated local gateway calls, validates destination/method/fields/limits,
      and reports credential/target readiness without revealing secrets.
  - order: 3
    service: nextops-gateway
    readiness: Gateway authenticates app identity, rechecks deterministic policy, enforces quotas/deadlines,
      records audit outcome, and routes only named tools.
  - order: 4
    service: local monitoring and backup
    readiness: Method/permission denials, latency, partial/stale results, audit failures, resource limits,
      token expiry, TLS expiry, and backup age are visible.
commands:
  - id: guest-preflight
    phase: preflight
    shell: bash
    run_as: authorized operator
    mode: read_only
    requires_authorization: true
    requires_inputs:
      - authorization.read_only_guest_discovery
    command: cat /etc/os-release && uname -r && systemd-detect-virt && lscpu && free -h
    purpose: Confirm the actual guest baseline and resources without changing them.
    expected_result: Approved Ubuntu/VMware baseline, 4 vCPUs, and 8 GiB are captured in private change
      evidence.
    failure_rule: Stop if identity/resources differ or support is unresolved.
  - id: storage-and-listener-preflight
    phase: preflight
    shell: bash
    run_as: authorized operator
    mode: read_only
    requires_authorization: true
    requires_inputs:
      - authorization.read_only_guest_discovery
    command: lsblk -o NAME,TYPE,SIZE,FSTYPE,MOUNTPOINTS,ROTA && findmnt && df -hT && timedatectl status
      && sudo ss -lntup
    purpose: Confirm disks/mounts/time and detect listener conflicts while retaining output privately.
    expected_result: Expected storage and trusted time are present; planned internal ports are free and
      no unexplained listener exists.
    failure_rule: Stop on unidentified disks, missing mounts, untrusted time, listener conflict, or sensitive
      output handling failure.
  - id: connector-release-integrity-check
    phase: artifact_import
    shell: bash
    run_as: authorized release operator
    mode: guarded_template
    requires_authorization: true
    requires_inputs:
      - artifact.connector_bundle_dir
      - artifact.connector_release_lock
    command: test -n "${NEXTOPS_CONNECTOR_BUNDLE_DIR:-}" && cd -- "$NEXTOPS_CONNECTOR_BUNDLE_DIR" && sha256sum
      -c SHA256SUMS
    purpose: Verify gateway/runner code, dependencies, schemas, manifests, fixtures, licenses, and checksums.
    expected_result: Every approved file verifies and the exact release/manifest/protocol versions are
      recorded.
    failure_rule: Fail closed on missing or mismatched listed artifacts; separately compare the bundle
      inventory/licenses with the approved lock and reject unlisted or unlicensed files. Do not download
      replacements at runtime.
  - id: zabbix-tls-probe
    phase: authorized_target_preflight
    shell: bash
    run_as: authorized connector operator
    mode: guarded_template
    requires_authorization: true
    requires_inputs:
      - authorization.zabbix_read_access
      - network.zabbix_host
      - network.zabbix_port
      - network.zabbix_ca_file
    command: test -n "${ZABBIX_HOST:-}" && test -n "${ZABBIX_PORT:-}" && test -n "${ZABBIX_CA_FILE:-}"
      && openssl s_client -connect "${ZABBIX_HOST}:${ZABBIX_PORT}" -servername "$ZABBIX_HOST" -CAfile
      "$ZABBIX_CA_FILE" -verify_return_error </dev/null
    purpose: Verify the authorized frontend TLS identity before any API credential is used.
    expected_result: Hostname and chain validation pass against the approved local CA and the certificate
      identity/expiry are recorded privately.
    failure_rule: Stop on name/chain/expiry failure, redirect ambiguity, unexpected address resolution,
      or unapproved endpoint. Never disable verification.
  - id: install-gateway-and-runner
    phase: install
    shell: bash
    run_as: authorized deployment operator
    mode: blocked
    requires_authorization: true
    requires_inputs:
      - authorization.provisioning
      - artifact.connector_release_lock
      - deployment.connector_runtime_mode
    command: null
    purpose: Install isolated gateway/runner processes, schemas, policies, and service definitions from
      the offline release.
    expected_result: Reproducible offline installation with separate identities, no broad shell/SQL, and
      no public listener.
    failure_rule: 'Blocked: the MCP gateway, Zabbix connector, dependencies, service units/Compose stack,
      and installer are not implemented.'
  - id: probe-zabbix-api-version-and-scope
    phase: authorized_target_validation
    shell: bash
    run_as: nextops-zabbix-ro through the reviewed connector only
    mode: blocked
    requires_authorization: true
    requires_inputs:
      - authorization.zabbix_read_access
      - artifact.connector_release_lock
      - target.zabbix_contract
      - secrets.zabbix_token_delivery
    command: null
    purpose: Call apiinfo.version, then bounded authenticated reads to prove method and host-group scope.
    expected_result: Version-compatible read methods succeed only inside approved scope; writes, unlisted
      methods, out-of-scope objects, oversized queries, and redirects are denied.
    failure_rule: Blocked until the typed connector exists; an API version probe alone is not authenticated
      readiness or monitoring health.
  - id: read-only-and-injection-tests
    phase: qualification
    shell: bash
    run_as: authorized security test operator in lab/approved target scope
    mode: blocked
    requires_authorization: true
    requires_inputs:
      - acceptance.connector_cases
      - artifact.connector_release_lock
      - authorization.zabbix_read_access
    command: null
    purpose: Test mutation denial, permission boundaries, prompt-injected event text, SSRF/destination
      checks, limits, timeouts, cancellation, redaction, and audit failure.
    expected_result: All prohibited operations fail deterministically; untrusted text remains data; required
      audit failure never becomes unlogged success.
    failure_rule: Blocked until the connector and versioned adversarial cases exist; never run mutation
      attempts against an unapproved production target.
  - id: rollback-connector-release
    phase: rollback
    shell: bash
    run_as: authorized recovery operator
    mode: blocked
    requires_authorization: true
    requires_inputs:
      - recovery.connector_last_known_good
      - recovery.connector_restore_evidence
    command: null
    purpose: Return to the last-known-good compatible gateway/runner/schema/config set and revoke superseded
      credentials if needed.
    expected_result: The prior release starts offline, retains its audited permissions/limits, and passes
      read/deny/failed-target checks.
    failure_rule: Blocked until versioned release switching, schema compatibility, token handling, and
      isolated restore are tested.
observability:
  - signal: gateway/runner release and manifest versions, enabled named tools, and target capability version
    source: sanitized readiness/capability record
    required_before_acceptance: true
    status: not_implemented
  - signal: calls, latency, deadlines, cancellations, row/byte/output caps, partial/stale results, and
      typed errors by named tool
    source: local gateway/runner metrics
    required_before_acceptance: true
    status: not_implemented
  - signal: policy/method/scope/destination denials and mandatory audit persistence outcomes
    source: application audit plus sanitized connector metrics
    required_before_acceptance: true
    status: not_implemented
  - signal: Zabbix endpoint certificate/permission/token expiry and authenticated API readiness
    source: runner readiness without secret values
    required_before_acceptance: true
    status: not_configured
  - signal: CPU, memory, queue, open files, process restarts, transient evidence usage, and free space
    source: local guest monitoring
    required_before_acceptance: true
    status: not_configured
backup_and_rollback:
  backup_scope:
    - gateway/runner releases, dependency locks, connector manifests, schemas, fixtures, checksums, and
      licenses
    - inventory/policy/connector settings without private endpoints if the public backup set is used
    - private configuration and secret-reference metadata through the approved encrypted backup boundary
    - protected service-auth/TLS/Zabbix-token recovery or rotation records through their owning mechanisms
    - versioned read/deny/offline acceptance evidence
  off_host_required: true
  restore_test_required: true
  rollback_trigger:
    - unauthorized destination, method, scope, or credential exposure
    - mutation or policy bypass becomes possible
    - audit, redaction, certificate validation, or limit enforcement fails
    - offline startup or target failure handling regresses
    - resource exhaustion or transient evidence cleanup is unsafe
  rollback_procedure_status: not_implemented; compatible gateway/runner/config release switching, credential
    response, and isolated restore must be tested
required_inputs:
  - id: authorization.provisioning
    classification: authorization
    required_before: any VM or guest change
    status: pending_authorization
    description: Approved change ticket/window with exact VM, network, artifacts, accounts, operations,
      and rollback authority.
    validation: Match the approved operation digest and recheck immediately before execution.
  - id: authorization.read_only_guest_discovery
    classification: authorization
    required_before: running guest preflight commands
    status: pending_authorization
    description: Authorization for read-only discovery on the connector guest.
    validation: Record target identity, operator, timestamp, commands, and sanitized private output reference.
  - id: authorization.zabbix_read_access
    classification: authorization
    required_before: any Zabbix network/API call
    status: pending_authorization
    description: Exact authorized Zabbix endpoint, host groups, methods, time range, operator, and test/change
      window.
    validation: Gateway and runner recheck scope immediately before the call; no documentation approval
      is treated as target access.
  - id: vm.connector_capacity
    classification: runtime_evidence
    required_before: VM creation
    status: not_run
    description: Current ESXi compatibility/capacity/contention, storage health/free space, and swap placement.
    validation: Private change-window evidence reconciles the 4-vCPU/8-GiB/80-GiB profile and combined
      four-VM budget.
  - id: deployment.connector_runtime_mode
    classification: deployment_decision
    required_before: artifact packaging/install
    status: missing
    description: Choose native systemd or restricted container deployment and define separate gateway/runner
      isolation, identities, limits, and restart dependencies.
    validation: Clean offline install, direct-call denial, no container socket, and dependency-aware restart
      pass.
  - id: artifact.connector_release_lock
    classification: artifact_lock
    required_before: installation
    status: missing
    description: Gateway/runner release, Python/MCP/HTTP dependency locks, schemas, supported target matrix,
      checksums, signatures, licenses, and fixtures.
    validation: Reproducible build, complete inventory, protocol conformance tests, clean offline install,
      and adversarial denial tests pass.
  - id: artifact.connector_bundle_dir
    classification: private
    required_before: artifact verification
    status: missing
    description: Absolute staging path under an approved import root.
    validation: Path resolves under the approved root; ownership/authenticity/checksums verify and no
      credentials/private inventory are bundled.
  - id: target.zabbix_contract
    classification: private
    required_before: connector configuration or target calls
    status: missing
    description: Stable target ID, private HTTPS endpoint/base path, resolved-address allowlist, API version,
      approved host groups, roles, method/field scope, limits, and freshness rules.
    validation: Certificate/hostname, redirect, version, permission, out-of-scope, current-problem, partial/stale,
      pagination, and limit tests pass.
  - id: network.zabbix_host
    classification: private
    required_before: TLS probe
    status: missing
    description: Approved Zabbix frontend DNS name only; not committed to this public repository.
    validation: Name resolves only to allowlisted addresses and matches the approved certificate/inventory
      target.
  - id: network.zabbix_port
    classification: private
    required_before: TLS probe
    status: missing
    description: Approved Zabbix frontend HTTPS port.
    validation: Port is in the target contract and firewall rule; no alternate service or redirect is
      accepted.
  - id: network.zabbix_ca_file
    classification: private
    required_before: TLS probe
    status: missing
    description: Absolute approved local CA bundle path.
    validation: Path is service-readable, integrity-managed, and validates the expected endpoint without
      disabling hostname/chain checks.
  - id: network.connector_boundaries
    classification: deployment_decision
    required_before: firewall/listener configuration
    status: missing
    description: Private IPs/names/ports, service identities, certificates, routes, address allowlists,
      DNS/time/monitoring/backup flows, and default-deny rules.
    validation: Only app-to-gateway, local gateway-to-runner, runner-to-approved-Zabbix, and approved
      support flows succeed.
  - id: secrets.zabbix_token_delivery
    classification: deployment_decision
    required_before: authenticated Zabbix calls
    status: missing
    description: Dedicated reader user/role/token, host-group/method scope, protected runner-only delivery,
      expiry, rotation, revocation, redaction, and recovery.
    validation: Token inheritance/permissions are tested; gateway/app/model/browser/process args/logs
      cannot obtain the value; revoked/expired token fails explicitly.
  - id: storage.connector_layout
    classification: deployment_decision
    required_before: guest partitioning/install
    status: missing
    description: Partition/filesystem, swap, release/rollback, transient evidence, logs, and staging allocations
      within 80 GiB.
    validation: Low-space/cleanup rules preserve referenced evidence and refuse any path outside an owned
      allowlisted root.
  - id: acceptance.connector_cases
    classification: deployment_decision
    required_before: qualification
    status: missing
    description: Versioned capability, read/deny, permission, prompt-injection, SSRF/redirect, timeout/cancellation,
      audit failure, offline, stale/partial, load, and recovery cases.
    validation: Human-approved expected outcomes; fixture/lab/production evidence labels remain distinct.
  - id: recovery.connector_last_known_good
    classification: artifact_lock
    required_before: promotion
    status: missing
    description: Compatible prior gateway/runner/manifests/config release and credential response plan.
    validation: Checksums verify and the prior set starts offline and passes minimum read/deny/failure
      tests.
  - id: recovery.connector_restore_evidence
    classification: runtime_evidence
    required_before: production acceptance
    status: not_run
    description: Independent backup and isolated offline restore result.
    validation: Restored release/config/trust material verifies; secrets are recovered/rotated only through
      their owner and no target access broadens.
acceptance_gates:
  - id: CONN-01
    description: App-to-gateway and gateway-to-runner authentication, process identities, network boundaries,
      direct-call denial, and resource limits are demonstrated.
    status: not_run
    evidence_reference: null
  - id: CONN-02
    description: The dedicated reader sees only approved host groups and version-compatible read methods;
      all writes, unlisted methods, arbitrary URLs, shell, SQL, redirects, and out-of-scope objects are
      denied.
    status: not_run
    evidence_reference: null
  - id: CONN-03
    description: Counts, active/resolved state, enabled/availability, suppression/maintenance, timestamps,
      scope, pagination, partial/stale markers, and typed errors match captured API evidence.
    status: not_run
    evidence_reference: null
  - id: CONN-04
    description: Prompt injection in target text, token expiry/revocation, endpoint/certificate failure,
      timeout/cancellation, and mandatory audit failure remain contained and truthful.
    status: not_run
    evidence_reference: null
  - id: CONN-05
    description: Cold start and new bounded reads work with Internet blocked and approved LAN retained;
      no remote registry, SaaS, public DNS dependency, or silent target fallback occurs.
    status: not_run
    evidence_reference: null
  - id: CONN-06
    description: Independent backup, rollback, and isolated restore reproduce the accepted gateway/runner
      release without exposing or broadening credentials.
    status: not_run
    evidence_reference: null
known_limitations:
  - No MCP gateway, connector runner, Zabbix client, manifest, service definition, installer, port, or
    target credential exists in the repository.
  - The Zabbix endpoint, API version, frontend base path, certificate, host-group scope, and actual permissions
    are private unresolved inputs.
  - The 80-GiB disk has no approved partition/transient-data layout and must not be formatted from this
    dossier.
  - This Phase 1 VM is read-only by design; write execution remains disabled and later requires a separately
    isolated VM and approval system.
  - All VMs share one physical G10 failure domain; connector isolation does not provide host-level availability.

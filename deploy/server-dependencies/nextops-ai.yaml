# Human-readable NextOps deployment dossier. This is a planning contract, not an installer.
# Keep real infrastructure identifiers and secrets in the approved private deployment record.
---
$schema: ./server-dependency.schema.json
schema_version: 1.0.0
manifest_revision: '2026-09-21'
server_id: nextops-ai
evidence_status: planning_contract_not_deployed
purpose: Run one authenticated local CPU-only inference service from verified offline model artifacts,
  isolated from target credentials, the management LAN, public AI providers, and runtime Internet access.
authorization:
  documentation_authorized: true
  provisioning_authorized: false
  operational_access_authorized: false
  destructive_actions_authorized: false
  notes: The owner accepted the CPU-local architecture, authorized the completed connected package/runtime/model
    preparation, and requested progression into Stage 1B. The reviewed native systemd profile now exists in
    source; installation, service startup, benchmarking, network changes, recovery, and promotion remain
    subject to the unresolved gates and private change record.
source_records:
  - docs/requirements/HARDWARE_BASELINE.json
  - docs/en/SERVER_PLAN.md
  - docs/en/CPU_AI.md
  - docs/en/AI_SYSTEMD.md
  - docs/en/TECH_STACK.md
  - docs/en/OFFLINE_RUNTIME.md
  - docs/en/SECURITY.md
  - docs/PROJECT_STATE.md
  - deploy/inference/qwen3-8b-q4-k-m.yaml
  - deploy/installers/install-nextops-ai.sh
  - deploy/systemd/README.md
vm:
  hypervisor: VMware ESXi 8.0.3 build 24414501 (owner-supplied host evidence)
  guest_os: Ubuntu Server 24.04 LTS proposed; exact image and maintained patch lock required
  vcpu: 24
  ram_gib: 128
  disk_gib: 500
  firmware: null
  cpu_hot_add: false
  proposed_datastore_alias: DS-C
  placement_status: Topology-aware experiment proposal only; no NUMA pinning, reservation, benchmark result,
    or VM is evidenced.
  deployment_order: 2 of the three NextOps VMs; after app VM definition and before live Stage 1B evaluation
  preflight_requirements:
    - Verify current host capacity, 4-node CPU/memory mapping, competing workloads, VM compatibility,
      and guest-visible CPU instruction sets.
    - Treat 24 vCPU and 128 GiB as an experiment budget, not inference thread count, user capacity, or
      performance guarantee.
    - Refresh DS-C capacity and include model versions, rollback artifacts, ESXi swap, snapshots, staging,
      and restore copies.
    - Confirm the AI VM has no route to the management LAN and no runtime Internet egress.
    - Define measurable Persian/English quality, latency, resource, queue, and failure targets before
      benchmarking.
service_accounts:
  - id: nextops-ai
    scope: one local CPU generation service and its verified model artifacts
    login: false
    privilege: non-root; read-only model/runtime paths, bounded writable cache/log paths, no target credentials
      or management-LAN access
    status: observed_created_non_login_identity
  - id: nextops-model-import
    scope: controlled provisioning-time artifact verification and promotion only
    login: false
    privilege: write only to approved staging/promotion paths during an authorized import; not a runtime
      service identity
    status: planned_not_created
software_dependencies:
  - id: ubuntu-server
    kind: guest_os
    version: 24.04 LTS maintained patch (exact image pending)
    runtime_location: local
    required: true
    status: proposed_not_installed
    lock_evidence: null
  - id: llama-cpp-cpu-runtime
    kind: inference_runtime
    version: v0.4.1 source tag at b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
    runtime_location: local
    required: true
    status: built_cpu_native_openblas_promoted_and_smoke_tested
    lock_evidence: deploy/inference/qwen3-8b-q4-k-m.yaml
  - id: multilingual-generation-model
    kind: model
    version: Qwen3-8B-Q4_K_M.gguf at repository revision 7c41481f57cb95916b40956ab2f0b139b296d974
    runtime_location: local
    required: true
    status: imported_sha256_verified_and_smoke_tested_not_benchmarked
    lock_evidence: deploy/inference/qwen3-8b-q4-k-m.yaml
  - id: model-tokenizer-template
    kind: model_support_artifacts
    version: embedded GGUF metadata from the selected source artifact
    runtime_location: local
    required: true
    status: embedded_metadata_used_in_verified_import_not_fully_acceptance_tested
    lock_evidence: deploy/inference/qwen3-8b-q4-k-m.yaml
  - id: cpu-runtime-native-libraries
    kind: native_runtime_dependencies
    version: null
    runtime_location: local
    required: true
    status: observed_openblas_openmp_cpu_build_complete_library_manifest_pending
    lock_evidence: deploy/inference/qwen3-8b-q4-k-m.yaml
  - id: systemd-or-restricted-container-runtime
    kind: service_manager
    version: null
    runtime_location: local
    required: true
    status: native_systemd_source_profile_implemented_not_installed
    lock_evidence: deploy/systemd/README.md
  - id: local-dns-time-pki
    kind: infrastructure_service
    version: null
    runtime_location: approved_lan
    required: true
    status: private_input_not_verified
    lock_evidence: null
  - id: independent-backup-target
    kind: recovery_service
    version: null
    runtime_location: approved_lan
    required: true
    status: production_gate_not_selected
    lock_evidence: null
artifacts:
  - id: llama-cpp-cpu-build
    purpose: Pinned CPU-only inference runtime binary/library set with build revision, compiler, flags,
      linked libraries, and device-startup report
    install_path: /srv/nextops/runtime/llama.cpp/<runtime-id>
    version: v0.4.1 at b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
    sha256: dbe5a5cdd4842fe2d498270c1e1df58344e9052e97214e2ba9c9845443a1b0dc
    license_record: MIT; official source license linked from the inference manifest
    source_record: deploy/inference/qwen3-8b-q4-k-m.yaml
    status: built_promoted_and_smoke_tested_complete_library_manifest_pending
  - id: generation-model-gguf
    purpose: Exact quantized multilingual model weights used for production answers
    install_path: /srv/nextops/models/<model-id>/model.gguf
    version: Qwen3-8B-Q4_K_M.gguf
    sha256: d98cdcbd03e17ce47681435b5150e34c1417f50b5c0019dd560e4882c5745785
    license_record: Apache-2.0; official model repository linked from the inference manifest
    source_record: deploy/inference/qwen3-8b-q4-k-m.yaml
    status: imported_promoted_and_sha256_verified_smoke_tested_not_accepted
  - id: model-metadata-and-template
    purpose: Immutable model source revision, quantization, tokenizer/template, context semantics, license,
      and evaluation metadata
    install_path: /srv/nextops/models/<model-id>/manifest.yaml
    version: 1.0.0 repository candidate contract
    sha256: null
    license_record: Runtime MIT and model Apache-2.0 source records
    source_record: deploy/inference/qwen3-8b-q4-k-m.yaml
    status: repository_manifest_and_import_evidence_recorded_full_release_manifest_pending
  - id: ai-offline-runtime-bundle
    purpose: Complete native libraries or pinned container image needed to cold-start without registries
      or user caches
    install_path: /srv/nextops/artifacts/inference
    version: null
    sha256: null
    license_record: null
    source_record: null
    status: not_prepared
  - id: ai-tls-public-chain
    purpose: Public trust material for authenticated app-to-inference transport; private key delivered
      separately
    install_path: /etc/nextops/tls
    version: null
    sha256: null
    license_record: not_applicable
    source_record: null
    status: private_pki_input_missing
configuration_files:
  - id: model-registry
    path: /etc/nextops/models.yaml
    owner: root:nextops-ai
    mode: '0640'
    contains_secret_values: false
    status: planned_no_runtime_parser_or_example_file_yet
    required_settings:
      - local runtime and model paths
      - immutable runtime/model revisions and checksums
      - license and quantization
      - chat template/tokenizer and supported capabilities
      - explicit no-external-provider setting
  - id: resource-profile
    path: /etc/nextops/resource-profiles.yaml
    owner: root:nextops-ai
    mode: '0640'
    contains_secret_values: false
    status: planned_unvalidated_until_benchmark
    required_settings:
      - CPU affinity/cgroup and thread budgets
      - one initial active request and bounded queue
      - prompt/context/output limits and deadlines
      - memory limits and overload behavior
      - measured cold/warm benchmark record ID
  - id: inference-service-config
    path: /etc/nextops/inference.yaml
    owner: root:nextops-ai
    mode: '0640'
    contains_secret_values: false
    status: native_systemd_and_environment_source_profile_implemented_not_installed
    required_settings:
      - internal bind address and port
      - authenticated client identity/audience
      - CPU-only and zero-offload controls
      - model ID and exact startup flags
      - request size, rate, concurrency, cancellation, and health semantics
secret_references:
  - id: inference-service-auth-ref
    consumer: nextops-ai
    reference_only: true
    delivery_requirement: Audience-bound internal service credential accepted only from nextops-app; never
      a target credential or user session token
    rotation_requirement: Support audited overlap and revocation without opening an unauthenticated listener
    status: two_distinct_systemd_credentials_implemented_in_source_not_delivered
  - id: inference-tls-private-key-ref
    consumer: nextops-ai
    reference_only: true
    delivery_requirement: Restricted private-key path or approved local key service with offline startup/recovery
    rotation_requirement: Define offline renewal, revocation, rollback, and expiry alerting
    status: private_pki_input_missing
network:
  runtime_internet_required: false
  public_exposure_allowed: false
  management_interface: Authorized local administrator route only; inference listener must remain internal
    and authenticated.
  rules:
    - id: app-to-inference
      direction: inbound
      source: nextops-app service identity
      destination: nextops-ai inference service
      protocol: tcp
      port: null
      tls: authenticated encrypted internal transport required
      decision: allow_planned
      status: port_protocol_certificate_and_identity_not_selected
    - id: admin-ssh
      direction: inbound
      source: approved administrator network
      destination: nextops-ai guest
      protocol: tcp
      port: 22
      tls: SSH host-key validation required
      decision: allow_planned
      status: private_admin_path_and_recovery_not_verified
    - id: management-lan
      direction: outbound
      source: nextops-ai
      destination: managed infrastructure and target APIs
      protocol: any
      port: any
      tls: not_applicable
      decision: deny_required
      status: architectural_boundary
    - id: runtime-internet
      direction: outbound
      source: nextops-ai runtime services
      destination: Internet, external AI, model registries, telemetry, and license heartbeats
      protocol: any
      port: any
      tls: not_applicable
      decision: deny_required
      status: must_be_enforced_and_tested
    - id: approved-local-infrastructure
      direction: outbound
      source: nextops-ai guest
      destination: approved local DNS, time, certificate, monitoring, and backup services
      protocol: deployment_specific
      port: null
      tls: certificate/host validation required where applicable
      decision: allow_planned
      status: private_endpoints_and_ports_missing
  unresolved:
    - Private IP, DNS name, VLAN, routes, firewall rules, and administrator recovery path
    - Inference protocol, bind address, port, service identity, certificates, and request limits
    - Approved local DNS, time, monitoring, certificate lifecycle, and backup endpoints
    - Network-level evidence that Internet, management-LAN, and external AI access are blocked
storage:
  total_disk_gib: 500
  layout_status: Total VMDK approved as an experiment/artifact-growth proposal; partition/LVM/filesystem
    allocation is not designed or authorized.
  mounts:
    - path: /
      purpose: Guest OS and immutable inference runtime
      size_gib: null
      filesystem: null
      owner: root:root
      mode: '0755'
      status: layout_required_before_provisioning
    - path: /srv/nextops/models
      purpose: Versioned verified model weights, tokenizer/template, and manifests
      size_gib: null
      filesystem: null
      owner: root:nextops-ai
      mode: '0750'
      status: model_set_and_growth_budget_missing
    - path: /srv/nextops/runtime
      purpose: Pinned CPU runtime releases and one last-known-good rollback build
      size_gib: null
      filesystem: null
      owner: root:nextops-ai
      mode: '0750'
      status: runtime_lock_missing
    - path: /etc/nextops
      purpose: Model registry, inference settings, resource profiles, and secret references
      size_gib: null
      filesystem: null
      owner: root:nextops-ai
      mode: '0750'
      status: observed_created_protected_path
    - path: /var/lib/nextops/inference
      purpose: Bounded local runtime state/cache; not an untracked model download cache
      size_gib: null
      filesystem: null
      owner: nextops-ai:nextops-ai
      mode: '0750'
      status: cache_policy_and_limit_missing
    - path: /var/log/nextops
      purpose: Sanitized inference service and performance logs without prompt, evidence, or secret content
      size_gib: null
      filesystem: null
      owner: nextops-ai:nextops-ai
      mode: '0750'
      status: retention_and_rotation_missing
  capacity_rules:
    - The 500-GiB VMDK includes OS, runtime, model versions, rollback artifacts, logs, bounded cache,
      and guest swap; do not double-count them.
    - Record every model/runtime file size and keep only reviewed active/rollback sets; never delete the
      only verified model copy automatically.
    - Avoid guest swap dependence during inference; record page faults, ballooning, host swapping, and
      memory locality in benchmarks.
    - Retain the 3-TB project ceiling and approximately 900-GiB DS-C free-space target; refresh capacity
      and thin commitments at the change window.
    - An independent verified artifact/backup copy outside the G10 is required for host-loss recovery.
  destructive_commands_included: false
service_order:
  - order: 1
    service: model/runtime/config mounts and protected key access
    readiness: Expected durable paths are mounted read-only where possible; every required checksum verifies.
  - order: 2
    service: nextops-llama then nextops-ai
    readiness: Exact runtime/model IDs load on CPU with zero offload, bounded resources, authenticated
      internal listener, and no network download.
  - order: 3
    service: authenticated AI readiness
    readiness: Readiness reports loaded model/revision, CPU execution, queue capacity, and degraded/unavailable
      states without exposing paths or secrets.
  - order: 4
    service: local monitoring and backup
    readiness: CPU/memory/queue/latency/artifact/free-space signals and independent artifact recovery
      are active before acceptance.
commands:
  - id: guest-cpu-numa-preflight
    phase: preflight
    shell: bash
    run_as: authorized operator
    mode: read_only
    requires_authorization: true
    requires_inputs:
      - authorization.read_only_guest_discovery
    command: lscpu && lscpu -e=CPU,CORE,SOCKET,NODE,ONLINE && nproc && free -h
    purpose: Capture guest-visible CPU topology, online CPUs, and memory without inferring physical placement.
    expected_result: 24 vCPUs and 128 GiB are visible; ISA/topology/affinity evidence is recorded with
      host-side placement data.
    failure_rule: Stop if resources differ, CPUs are unexpectedly offline, memory is pressured, or required
      CPU features are absent.
  - id: resource-affinity-preflight
    phase: preflight
    shell: bash
    run_as: authorized operator
    mode: read_only
    requires_authorization: true
    requires_inputs:
      - authorization.read_only_guest_discovery
    command: systemctl show --property=AllowedCPUs,AllowedMemoryNodes nextops-llama.service nextops-ai.service
      2>/dev/null || true; cat /proc/self/status | sed -n '/Cpus_allowed_list/p;/Mems_allowed_list/p'
    purpose: Inspect effective CPU/memory-node constraints without changing affinity.
    expected_result: Effective limits match the approved resource profile or are explicitly recorded as
      not yet configured.
    failure_rule: Do not benchmark until guest and host-side placement/limits are understood.
  - id: storage-preflight
    phase: preflight
    shell: bash
    run_as: authorized operator
    mode: read_only
    requires_authorization: true
    requires_inputs:
      - authorization.read_only_guest_discovery
    command: lsblk -o NAME,TYPE,SIZE,FSTYPE,MOUNTPOINTS,ROTA && findmnt && df -hT
    purpose: Verify durable model/runtime paths and available space before importing large artifacts.
    expected_result: Approved filesystems are mounted with sufficient active, rollback, staging, and recovery
      margin.
    failure_rule: Stop on unidentified disks, missing mounts, existing data conflicts, or insufficient
      capacity.
  - id: artifact-integrity-check
    phase: artifact_import
    shell: bash
    run_as: authorized model import operator
    mode: guarded_template
    requires_authorization: true
    requires_inputs:
      - artifact.ai_bundle_dir
      - artifact.ai_runtime_model_lock
    command: test -n "${NEXTOPS_AI_BUNDLE_DIR:-}" && cd -- "$NEXTOPS_AI_BUNDLE_DIR" && sha256sum -c SHA256SUMS
    purpose: Verify runtime, weights, tokenizer/template, metadata, and supporting libraries before promotion.
    expected_result: Every approved file verifies and exact source revision, license, quantization, build
      flags, and checksum evidence are recorded.
    failure_rule: Fail closed on missing or mismatched listed artifacts; separately compare the bundle
      inventory with the approved lock and reject unlisted files. Do not resolve a model name or download
      at startup.
  - id: inspect-runtime-linkage
    phase: artifact_validation
    shell: bash
    run_as: authorized model import operator
    mode: guarded_template
    requires_authorization: true
    requires_inputs:
      - artifact.ai_runtime_binary
    command: test -n "${NEXTOPS_INFERENCE_BINARY:-}" && test -x "$NEXTOPS_INFERENCE_BINARY" && readelf
      -d "$NEXTOPS_INFERENCE_BINARY"
    purpose: Inspect native dependency declarations without using ldd or executing an untrusted artifact.
    expected_result: NEEDED entries match the approved dependency inventory; a later isolated clean start
      proves they resolve only to approved local files.
    failure_rule: Stop on an unexpected accelerator/cloud/helper dependency, missing inventory entry,
      or artifact outside the verified bundle.
  - id: install-exact-os-packages
    phase: package_install
    shell: bash
    run_as: authorized deployment operator through sudo
    mode: guarded_template
    requires_authorization: true
    requires_inputs:
      - authorization.provisioning
      - artifact.ai_package_bundle
    command: test -n "${NEXTOPS_PACKAGE_BUNDLE_DIR:-}" && test -n "${NEXTOPS_PACKAGE_MANIFEST_SHA256:-}"
      && test -n "${NEXTOPS_CHANGE_ID:-}" && sudo env NEXTOPS_PROVISIONING_AUTHORIZED=YES
      ./deploy/installers/install-nextops-ai.sh --apply --bundle-dir "$NEXTOPS_PACKAGE_BUNDLE_DIR"
      --bundle-manifest-sha256 "$NEXTOPS_PACKAGE_MANIFEST_SHA256" --change-id "$NEXTOPS_CHANGE_ID"
    purpose: Install only the authenticated exact CPU build/runtime package layer without building,
      importing, configuring, or starting the inference service.
    expected_result: Every locked compiler/OpenBLAS support package and transitive dependency is installed
      at its exact version from the signed offline repository; no service is started.
    failure_rule: Stop on any missing/unlisted/mismatched artifact, repository signature failure, package
      removal, unsafe bundle permissions, wrong guest baseline, or authorization mismatch. Do not substitute
      CUDA/ROCm packages or fetch/build the model.
  - id: install-inference-runtime
    phase: install
    shell: bash
    run_as: authorized deployment operator
    mode: blocked
    requires_authorization: true
    requires_inputs:
      - authorization.provisioning
      - artifact.ai_runtime_model_lock
      - deployment.ai_runtime_mode
    command: null
    purpose: Install the pinned CPU runtime, model, configuration, and service definition from an offline
      bundle.
    expected_result: Reproducible local CPU-only service with no runtime download or external provider.
    failure_rule: Blocked until the runtime commit/build flags, model revision/quantization/license/checksums,
      and service definition pass review.
  - id: cpu-only-startup-proof
    phase: start
    shell: bash
    run_as: authorized deployment operator
    mode: blocked
    requires_authorization: true
    requires_inputs:
      - artifact.ai_runtime_model_lock
      - deployment.ai_startup_flags
      - network.internal_service_contracts
    command: null
    purpose: Cold-start the exact model/runtime and capture the startup device report, flags, and readiness.
    expected_result: The selected model loads entirely from durable local artifacts, reports CPU-only/zero
      offload, and accepts only authenticated app requests.
    failure_rule: Blocked until exact runtime flags and health semantics exist; stop on any GPU/offload,
      external call, missing artifact, or unauthenticated listener.
  - id: benchmark-and-bilingual-evaluation
    phase: qualification
    shell: bash
    run_as: authorized performance/evaluation operator
    mode: blocked
    requires_authorization: true
    requires_inputs:
      - acceptance.ai_targets
      - deployment.ai_resource_profile
      - artifact.ai_runtime_model_lock
    command: null
    purpose: Run versioned Persian/English quality, tool-argument, cold/warm latency, queue, cancellation,
      and resource cases.
    expected_result: Actual p50/p95, time-to-first-token, total latency, throughput, memory, CPU pressure,
      page faults, errors, and quality outcomes are retained.
    failure_rule: Blocked until corpus, sample count, context/output sizes, concurrency steps, sustained
      duration, and acceptance thresholds are approved.
  - id: rollback-runtime-model
    phase: rollback
    shell: bash
    run_as: authorized recovery operator
    mode: blocked
    requires_authorization: true
    requires_inputs:
      - recovery.ai_last_known_good
      - recovery.ai_restore_evidence
    command: null
    purpose: Return atomically to the last-known-good compatible runtime/model/config set.
    expected_result: The previous set cold-starts offline, verifies checksums, and passes the minimum
      bilingual/readiness tests.
    failure_rule: Blocked until versioned release switching and an isolated artifact restore are tested;
      do not mix runtime, model, tokenizer, or template revisions.
observability:
  - signal: runtime/model revision, startup flags, CPU device report, and cold/warm state
    source: sanitized local startup/readiness record
    required_before_acceptance: true
    status: not_implemented
  - signal: queue delay, time to first token, prompt/generation throughput, full-answer latency, errors,
      and cancellations
    source: local inference metrics
    required_before_acceptance: true
    status: not_implemented
  - signal: CPU utilization/pressure, affinity, NUMA locality, host CPU ready/co-stop, memory, ballooning/swap,
      and page faults
    source: guest plus authorized host monitoring
    required_before_acceptance: true
    status: not_measured
  - signal: active requests, queue length, rejected overload, context/output sizes, and deadline expirations
    source: bounded inference scheduler
    required_before_acceptance: true
    status: not_implemented
  - signal: artifact checksum, free space, model-load failures, and prohibited external connection attempts
    source: local integrity/filesystem/network monitoring
    required_before_acceptance: true
    status: not_configured
backup_and_rollback:
  backup_scope:
    - exact CPU runtime binaries/libraries plus build revision and flags
    - model weights, tokenizer/template, manifest, license, source, and checksums
    - validated resource/inference configuration without secret values
    - public trust material and protected internal-auth/TLS recovery through its approved mechanism
    - versioned bilingual evaluation corpus and accepted result records
  off_host_required: true
  restore_test_required: true
  rollback_trigger:
    - checksum or license mismatch
    - GPU/offload or unexpected external dependency detected
    - Persian/English quality or structured-output regression
    - latency, memory, swap, queue, cancellation, or error thresholds exceeded
    - offline cold start, authentication, or readiness failure
  rollback_procedure_status: not_implemented; compatible runtime/model/config release switching and isolated
    offline restore must be tested
required_inputs:
  - id: authorization.provisioning
    classification: authorization
    required_before: any VM, model import, or guest change
    status: pending_authorization
    description: Approved change ticket/window with exact VM, operator, artifacts, operations, and rollback
      authority.
    validation: Match the approved operation digest and recheck immediately before execution.
  - id: authorization.read_only_guest_discovery
    classification: authorization
    required_before: running guest preflight commands
    status: pending_authorization
    description: Authorization for read-only discovery on the actual AI guest.
    validation: Record target identity, operator, timestamp, commands, and sanitized guest/host topology
      evidence.
  - id: vm.ai_topology_capacity
    classification: runtime_evidence
    required_before: VM creation and benchmarking
    status: not_run
    description: Current host capacity/contention, actual NUMA mapping, VM compatibility, guest ISA, storage
      latency/free space, and swap/balloon state.
    validation: Correlate private host metrics with guest evidence; do not infer physical placement from
      arithmetic averages or guest view alone.
  - id: deployment.ai_runtime_mode
    classification: deployment_decision
    required_before: artifact packaging
    status: missing
    description: Native systemd is selected in source with separate llama.cpp and authenticated API units,
      file-backed credentials, loopback-only cgroup network policy, CPU/memory/task limits, writable paths,
      and restart behavior.
    validation: Clean offline install and cold start pass with no container socket, registry pull, or
      interactive-user cache.
  - id: artifact.ai_package_bundle
    classification: artifact_lock
    required_before: OS package installation
    status: missing
    description: Root-owned role-specific signed local APT repository, complete exact packages.lock,
      all-file manifest, separately delivered manifest digest, and license/source inventory.
    validation: The guarded nextops-ai script passes check mode and a clean Ubuntu 24.04 VMware apply
      without Internet, unlisted package changes, service starts, or accelerator packages.
  - id: artifact.ai_runtime_model_lock
    classification: artifact_lock
    required_before: model import or installation
    status: missing
    description: Runtime commit/build flags/compiler/libraries; model source revision, quantization, tokenizer/template,
      license, sizes, and SHA-256 values.
    validation: Reproducible CPU build, complete license/checksum inventory, clean offline import, and
      exact runtime/model compatibility tests.
  - id: artifact.ai_bundle_dir
    classification: private
    required_before: artifact verification
    status: missing
    description: Absolute staging path under an approved import root.
    validation: Resolve under the approved root, verify ownership and signed/checksummed manifest, and
      exclude credentials/private inventory.
  - id: artifact.ai_runtime_binary
    classification: private
    required_before: native dependency inspection
    status: missing
    description: Absolute path to the reviewed inference binary inside the staging bundle.
    validation: Path resolves inside the verified bundle and its SHA-256 matches the artifact lock.
  - id: storage.ai_layout
    classification: deployment_decision
    required_before: guest partitioning and artifact import
    status: missing
    description: Partition/LVM/filesystem, swap, model/runtime active and rollback sets, staging, logs,
      cache, and restore margin within 500 GiB.
    validation: Sizing includes actual artifact sizes and low-space thresholds; mount/checksum failure
      blocks startup.
  - id: network.internal_service_contracts
    classification: deployment_decision
    required_before: listener/firewall/TLS configuration
    status: missing
    description: Private address/name/port, app client identity, certificate trust, administrator route,
      and approved local support services.
    validation: Only the authenticated app and administrators reach the service; management LAN, Internet,
      and unauthenticated calls are blocked.
  - id: deployment.ai_startup_flags
    classification: deployment_decision
    required_before: service start
    status: missing
    description: The source profile fixes model alias/path convention, 8K context, 16 generation and batch
      threads, one slot, bounded batches/timeouts, zero GPU layers, loopback binding, disabled Web UI/slots,
      cgroup resource limits, and journal logging. Target support and measurements remain required.
    validation: Flags are supported by the pinned revision, captured in audit/readiness, and reproduce
      the accepted benchmark.
  - id: deployment.ai_resource_profile
    classification: deployment_decision
    required_before: qualification and production start
    status: missing
    description: Measured CPU/thread/affinity/memory/concurrency/queue/context/output profile shared with
      host workload budgets.
    validation: Approved after controlled 16/24/28-vCPU or thread experiments as applicable; no hidden
      BLAS/OpenMP oversubscription.
  - id: acceptance.ai_targets
    classification: deployment_decision
    required_before: benchmarking
    status: missing
    description: Versioned Persian/English corpus, structured-output/tool cases, sample counts, latency/error/resource
      limits, concurrency steps, and sustained duration.
    validation: Human-approved before execution; results preserve exact inputs, versions, cold/warm state,
      and measured outcomes.
  - id: recovery.ai_last_known_good
    classification: artifact_lock
    required_before: promotion
    status: missing
    description: Compatible previous runtime/model/template/config set retained for rollback.
    validation: Checksums verify and the set cold-starts offline with minimum accepted bilingual/readiness
      results.
  - id: recovery.ai_restore_evidence
    classification: runtime_evidence
    required_before: production acceptance
    status: not_run
    description: Independent artifact backup and isolated offline restore result.
    validation: Restored files verify and cold-start without GitHub, model registries, package registries,
      or user caches.
acceptance_gates:
  - id: AI-01
    description: Exact pinned runtime/model/template starts from durable local files and reports CPU-only
      execution with zero GPU/offload and no external provider.
    status: not_run
    evidence_reference: null
  - id: AI-02
    description: Only the authenticated nextops-app identity can submit bounded requests; browser, connectors,
      targets, and unauthenticated callers cannot reach inference.
    status: not_run
    evidence_reference: null
  - id: AI-03
    description: Approved Persian/English quality and structured-output cases pass with recorded p50/p95
      latency, resource, queue, cancellation, and error measurements.
    status: not_run
    evidence_reference: null
  - id: AI-04
    description: Cold start and fresh answers succeed with Internet blocked; missing/corrupt artifacts
      fail readiness without downloads, cloud fallback, or fake answers.
    status: not_run
    evidence_reference: null
  - id: AI-05
    description: Saturation uses bounded queues/backpressure and leaves app authentication, audit, and
      non-AI diagnostics available.
    status: not_run
    evidence_reference: null
  - id: AI-06
    description: Independent artifact backup, rollback, and isolated offline restore reproduce the accepted
      runtime/model identity.
    status: not_run
    evidence_reference: null
known_limitations:
  - The pinned llama.cpp runtime and Qwen model were built/imported, hash-verified, and CPU smoke-tested.
    The native systemd units, two credential boundary, loopback ports, and initial resource profile now exist
    in source but are not installed or target-verified; offline cold start, quality, load, rollback, restore,
    and full benchmark acceptance remain open.
  - The 24-vCPU/128-GiB profile is an experiment budget; it is not a thread count, concurrency promise,
    performance result, or proven one-NUMA-node fit.
  - The 500-GiB disk has no approved partition or artifact-retention layout and must not be formatted
    from this dossier.
  - All VMs share one physical G10 failure domain; local AI is unavailable during host loss despite offline
    Internet independence.

limit_req_zone $binary_remote_addr zone=nextops_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nextops_assistant:10m rate=12r/m;

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nextops/tls/nextops-app.crt;
    ssl_certificate_key /etc/nextops/tls/nextops-app.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:nextops_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/nextops-access.log;
    error_log /var/log/nginx/nextops-error.log warn;

    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location ~ ^/api/v1/(bootstrap|recovery)$ {
        return 404;
    }

    location = /api/v1/login {
        limit_req zone=nextops_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/v1/(assistant/generate|investigate)$ {
        limit_req zone=nextops_assistant burst=3 nodelay;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }
}

[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "nextops"
version = "0.1.0"
description = "Local-first infrastructure operations assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.116,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "jsonschema>=4.23,<5",
  "mypy>=1.13,<2",
  "playwright>=1.63,<1.64",
  "pytest>=8.3,<10",
  "pyyaml>=6.0,<7",
  "ruff>=0.8,<1",
  "setuptools>=83,<84",
  "types-jsonschema>=4.23,<5",
  "types-pyyaml>=6.0,<7",
]

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
"nextops.api" = ["static/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires an isolated PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["nextops"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "tests", "deploy/installers"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true

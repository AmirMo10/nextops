[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "nextops"
version = "0.1.0"
description = "Local-first infrastructure operations assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pyyaml>=6.0,<7",
  "ruff>=0.8,<1",
  "setuptools>=83,<84",
  "types-jsonschema>=4.23,<5",
  "types-pyyaml>=6.0,<7",
]

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["nextops"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
